<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>消息盒子</title>
<style>
  @font-face { font-family:'RuanTang'; src:url('../fonts/ruantang.ttf') format('truetype'); }
  html,body { margin:0; height:100%; background:transparent; overflow:hidden; font-family:'RuanTang','Microsoft YaHei',sans-serif; color:#22475f; user-select:none; }
  .box { margin:8px; height:calc(100% - 16px); display:flex; flex-direction:column; border:2px solid #8fd9f4; border-radius:16px; overflow:hidden; background:linear-gradient(180deg,rgba(255,255,255,.98),rgba(232,249,255,.98)); box-shadow:0 14px 30px rgba(20,70,110,.24); }
  .head { -webkit-app-region:drag; display:flex; align-items:center; justify-content:space-between; padding:8px 11px; border-bottom:1px solid #e2f3fb; font-size:12px; color:#2a7fb6; }
  .head button { -webkit-app-region:no-drag; border:0; background:transparent; color:#7aa6bf; font-size:14px; cursor:pointer; }
  .list { flex:1; overflow-y:auto; padding:8px; display:flex; flex-direction:column; gap:7px; }
  .item { background:#fff; border:1.5px solid #bfe6f7; border-radius:12px; padding:8px 10px; font-size:12px; line-height:1.45; cursor:pointer; }
  .item:hover { background:#f0fbff; }
  .item .who { color:#2a7fb6; font-size:11px; margin-bottom:3px; }
  .empty { color:#86adc2; font-size:11px; text-align:center; margin-top:30px; }
</style>
</head>
<body>
  <div class="box">
    <div class="head"><span>📥 消息盒子</span><button id="close">✕</button></div>
    <div class="list" id="list"><div class="empty">还没有新消息</div></div>
  </div>
<script>
  const api = window.ycpPet || {}
  const list = document.getElementById('list')
  let unread = []
  function render() {
    list.innerHTML = ''
    if (!unread.length) { list.innerHTML = '<div class="empty">还没有新消息</div>'; return }
    for (const item of unread.slice(-8).reverse()) {
      const el = document.createElement('div')
      el.className = 'item'
      const who = document.createElement('div'); who.className = 'who'; who.textContent = item.name || '她'
      const text = document.createElement('div'); text.textContent = item.text
      el.appendChild(who); el.appendChild(text)
      el.onclick = () => { if (api.notifyOpen) api.notifyOpen(item.id) }
      list.appendChild(el)
    }
  }
  if (api.onNotify) api.onNotify((messages) => { unread = Array.isArray(messages) ? messages : []; render() })
  document.getElementById('close').onclick = () => { if (api.notifyClose) api.notifyClose() }
</script>
</body>
</html>
