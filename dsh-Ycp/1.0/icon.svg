  <path d="M93 131 Q100 138 107 131" fill="none" stroke="#B85C6E" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M96 136 Q100 139 104 136" fill="none" stroke="#EBA3B1" stroke-width="1.4" stroke-linecap="round" opacity=".85"/>
  <path d="M99 124 Q101 126 100 128" fill="none" stroke="#E0A08F" stroke-width="1.3" stroke-linecap="round" opacity=".5"/>

