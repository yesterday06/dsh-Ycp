  <path d="M112 108 Q119 103.4 126 108" fill="none" stroke="#E8FBFF" stroke-width="1.6" stroke-linecap="round" opacity=".85"/>
  <circle cx="84.6" cy="122.6" r="1.4" fill="#FFFFFF" opacity=".85"/>
  <circle cx="122.6" cy="122.6" r="1.4" fill="#FFFFFF" opacity=".85"/>
  <path d="M68 104 Q64 100 60 102" fill="none" stroke="#0C2A3E" stroke-width="2.4" stroke-linecap="round"/>
  <path d="M132 104 Q136 100 140 102" fill="none" stroke="#0C2A3E" stroke-width="2.4" stroke-linecap="round"/>
