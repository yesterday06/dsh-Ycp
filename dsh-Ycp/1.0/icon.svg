<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img" aria-label="大肥鱼 鲸鱼娘">
  <defs>
    <linearGradient id="skin" x1="60" y1="60" x2="140" y2="150" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFF9F3"/>
      <stop offset="1" stop-color="#FFDCC9"/>
    </linearGradient>
    <linearGradient id="hair" x1="50" y1="40" x2="150" y2="150" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#79D2EE"/>
      <stop offset=".45" stop-color="#55B7DE"/>
      <stop offset="1" stop-color="#3A8FC2"/>
    </linearGradient>
    <linearGradient id="iris" x1="0" y1="94" x2="0" y2="132" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0B2E45"/>
      <stop offset=".5" stop-color="#2E92C8"/>
      <stop offset="1" stop-color="#C6F1FF"/>
    </linearGradient>
    <linearGradient id="hoodie" x1="40" y1="150" x2="160" y2="200" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#65C6EC"/>
      <stop offset="1" stop-color="#2579B4"/>
    </linearGradient>
    <linearGradient id="fluke" x1="80" y1="20" x2="120" y2="50" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#8ADFF9"/>
      <stop offset="1" stop-color="#1E6AA3"/>
    </linearGradient>
    <radialGradient id="cheek" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#FF9AB2" stop-opacity=".8"/>
      <stop offset="1" stop-color="#FF9AB2" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bubble" cx=".35" cy=".3" r=".75">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".95"/>
      <stop offset=".6" stop-color="#CDF1FF" stop-opacity=".45"/>
      <stop offset="1" stop-color="#8FD8F6" stop-opacity=".15"/>
    </radialGradient>
  </defs>

  <!-- 气泡 -->
  <circle cx="26" cy="72" r="5" fill="url(#bubble)"/>
  <circle cx="36" cy="54" r="3" fill="url(#bubble)"/>
  <circle cx="176" cy="96" r="4" fill="url(#bubble)"/>
  <circle cx="168" cy="74" r="2.6" fill="url(#bubble)"/>

  <!-- 卫衣身体 -->
  <path d="M56 168 C56 154 74 146 100 146 C126 146 144 154 144 168 L152 200 L48 200 Z" fill="url(#hoodie)"/>
  <path d="M56 168 C56 154 74 146 100 146 C126 146 144 154 144 168" fill="none" stroke="#9BE3FA" stroke-width="2.4" opacity=".6"/>
  <path d="M100 146 L100 200" stroke="#3C97C8" stroke-width="1.2" opacity=".35"/>

  <!-- 脖子 -->
  <path d="M91 132 L109 132 L109 152 C109 158 91 158 91 152 Z" fill="#F6C9B6"/>

  <!-- 后发 -->
  <path d="M46 112 C44 64 68 36 100 36 C132 36 156 64 154 112 C154 132 148 144 142 150 C146 128 144 112 140 102 C138 128 128 140 118 146 C124 128 122 114 118 106 C112 128 100 140 88 144 C94 126 92 112 88 104 C82 124 70 136 60 142 C64 126 62 116 58 106 C54 118 50 130 52 150 C48 142 46 128 46 112 Z" fill="url(#hair)"/>

