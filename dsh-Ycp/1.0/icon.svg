  <circle cx="62" cy="72" r="3.2" fill="#DFF7FF" opacity=".45"/>
  <circle cx="72" cy="60" r="2" fill="#DFF7FF" opacity=".35"/>
  <circle cx="140" cy="86" r="2.6" fill="#DFF7FF" opacity=".35"/>
